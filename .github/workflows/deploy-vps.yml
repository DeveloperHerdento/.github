# Reusable deploy to a VPS with Docker Compose (HGS-STD 8.3-8.9, uniform CI/CD contract).
#   develop -> staging (automatic) · main -> production (waits for the reviewers of the "production" environment)
#
# Steps: build image -> push to GHCR as :<stage> and :<stage>-<sha> -> SSH to the server ->
#        compose pull -> optional migration -> compose up -> wait until healthy -> prune -> smoke test from the internet.
#
# Called from each repo's .github/workflows/deploy.yml with `secrets: inherit`.
# Needs per GitHub Environment: secrets SSH_HOST, SSH_USER, SSH_KEY, SSH_FINGERPRINT and variable APP_URL.
name: deploy-vps

on:
  workflow_call:
    inputs:
      context:
        description: Docker build context (e.g. "backend")
        type: string
        default: "."
      dockerfile:
        description: Dockerfile path inside the context
        type: string
        default: Dockerfile
      image-suffix:
        description: Added to the image name when a repo builds several images, e.g. "-frontend"
        type: string
        default: ""
      service:
        description: Compose service to wait for (must have a healthcheck)
        type: string
        default: api
      health-path:
        description: Path checked from the internet after deploy
        type: string
        default: /health
      migrate-script:
        description: Shell run on the server after pull and before up, e.g. a database migration
        type: string
        default: ""
      build-only:
        description: Only build and push the image; a later call (with secrets) updates the server with all images
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: image name and stage
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}${{ inputs.image-suffix }}" >> "$GITHUB_ENV"
          echo "STAGE=${{ github.ref_name == 'main' && 'production' || 'staging' }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.STAGE }}
            ${{ env.IMAGE }}:${{ env.STAGE }}-${{ github.sha }}
          cache-from: type=gha,scope=image${{ inputs.image-suffix }} # one cache per image when a repo builds several
          cache-to: type=gha,mode=max,scope=image${{ inputs.image-suffix }}

  deploy:
    needs: build
    if: ${{ !inputs.build-only }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      STAGE: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          script: |
            set -e
            cd /opt/${{ github.event.repository.name }}/${{ env.STAGE }}
            docker compose pull
            ${{ inputs.migrate-script }}
            docker compose up -d
            timeout 120 sh -c 'until [ "$(docker inspect -f {{.State.Health.Status}} $(docker compose ps -q ${{ inputs.service }}))" = healthy ]; do sleep 3; done'
            docker image prune -f
      - name: smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.APP_URL }}${{ inputs.health-path }}"
